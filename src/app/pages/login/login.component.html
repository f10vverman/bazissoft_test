<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1 class="title">Вход в систему</h1>

    <tui-textfield>
      <label tuiLabel>Логин</label>
      <input tuiInput type="text" formControlName="username" />
    </tui-textfield>
    <tui-error class="error" [formControl]="form.controls.username" />

    <tui-textfield class="mt-2">
      <label tuiLabel>Пароль</label>
      <input tuiInput type="password" formControlName="password" />
    </tui-textfield>
    <tui-error class="error" [formControl]="form.controls.password" />

    <button tuiButton type="submit" [disabled]="form.invalid" class="mt-3">
      Войти
    </button>
  </form>
</div>
